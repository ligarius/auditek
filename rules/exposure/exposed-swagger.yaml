id: exposed-api-docs
info:
  name: "Documentación de API expuesta"
  severity: low
  tags: [exposure, api]
  description: "Documentación Swagger/OpenAPI accesible"
  impact: "Expone la estructura completa de la API (endpoints, parámetros, modelos de datos) — facilita que un atacante mapee la superficie de ataque sin necesidad de fuerza bruta."
type: http
http:
  - method: GET
    path:
      - "{{BaseURL}}/swagger.json"
      - "{{BaseURL}}/api-docs"
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words: ["swagger", "paths", "components"]
        condition: and
    matchers-condition: and
  - method: GET
    path:
      - "{{BaseURL}}/swagger-ui.html"
    matchers:
      - type: status
        status: [200]
      - type: word
        part: body
        words: ["swagger", "SwaggerUIBundle", "url:"]
        condition: and
    matchers-condition: and
